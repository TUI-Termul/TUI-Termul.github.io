name: Deploy landing page

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild from TUI-Termul/landing-page so the org root stays current.
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TUI-Termul/landing-page
          ref: main
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # Org site is served at /, not /landing-page/.
      - run: npm run build
        working-directory: site
        env:
          GITHUB_PAGES: "0"
      - name: SPA fallback for / and /l
        working-directory: site
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/l
          cp dist/index.html dist/l/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
